services:
  backend:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/corehub 
    volumes:
      - ./src:/app/src
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          memory: 512M

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1G 

volumes:
  mongo_data: